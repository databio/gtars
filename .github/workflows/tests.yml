name: Run tests

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# NOTE: The Rust test suite is run (instrumented) by the "Compute coverage"
# workflow via `cargo llvm-cov --workspace`, which is itself a test run. To
# avoid paying for a second full compile of the same tests, this workflow only
# covers the language-binding suites (R and Python), each in its own parallel
# job with its own cache.
# Release builds (build-binaries, build-python-bindings, build-r-bindings) use
# default features, which already include `blast`, so they need no edits; the
# `blast` job below checks those feature sets on every PR.
jobs:
  blast:
    name: BLAST tests and feature checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # The `golden` tests are pinned to BLAST+ 2.17.0 (apt ships 2.12), so
      # this job uses NCBI's release tarball. codecov.yml runs the same tests
      # through the ncbi/blast:2.17.0 docker image instead.
      - name: Cache BLAST+ 2.17.0
        id: blast-cache
        uses: actions/cache@v4
        with:
          path: ~/blast
          key: ncbi-blast-2.17.0-x64-linux

      - name: Download BLAST+ 2.17.0
        if: steps.blast-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blast && cd ~/blast
          b=https://ftp.ncbi.nlm.nih.gov/blast/executables/blast+/2.17.0
          f=ncbi-blast-2.17.0+-x64-linux.tar.gz
          curl -fsSL --retry 3 -O "$b/$f" -O "$b/$f.md5"
          md5sum -c "$f.md5"
          tar xzf "$f" ncbi-blast-2.17.0+/bin
          rm "$f" "$f.md5"

      - name: Put BLAST+ on PATH
        run: |
          echo "$HOME/blast/ncbi-blast-2.17.0+/bin" >> "$GITHUB_PATH"
          "$HOME/blast/ncbi-blast-2.17.0+/bin/makeblastdb" -version

      - name: Test gtars-rgblast (BLAST+ and golden tests)
        run: cargo test -p gtars-rgblast --features golden

      - name: Test gtars blast CLI
        run: cargo test -p gtars-cli --test blast_cli

      - name: Check release feature sets
        run: |
          cargo check -p gtars-rgblast
          cargo check -p gtars-cli
          cargo check -p gtars-py

  r:
    name: R tests
    runs-on: ubuntu-latest
    env:
      # Keep cargo's download cache in ~/.cargo (see gtars-r/src/Makevars).
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4

      # gtars-r compiles a Rust crate (via extendr) during R CMD INSTALL.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gtars-r/src/rust

      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      # Installs Imports + Suggests from gtars-r/DESCRIPTION (testthat,
      # data.table, BiocGenerics, IRanges, ...) from binary repos and caches
      # the package library. Fails the step if a dependency cannot be installed.
      - name: Install R dependencies (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: gtars-r
          dependencies: '"all"'
          extra-packages: any::rextendr any::roxygen2

      - name: Set R library path
        run: echo "LD_LIBRARY_PATH=$(R RHOME)/lib" >> "$GITHUB_ENV"

      - name: Install R package
        run: R CMD INSTALL gtars-r

      # Lists skipped tests so a silent skip (no python3, no blastn) shows.
      - name: Run R tests
        run: |
          Rscript -e 'r <- as.data.frame(testthat::test_dir("gtars-r/tests/testthat", stop_on_failure = TRUE));
            s <- r[r$skipped, c("file", "test")]; cat(nrow(s), "skipped\n"); print(s, row.names = FALSE)'

      # The wrappers and man pages must match what extendr and roxygen2
      # generate (wrappers come from the installed library).
      - name: Check generated R wrappers and docs
        run: |
          Rscript -e 'library(gtars); rextendr:::make_wrappers("gtars", "gtars", "gtars-r/R/extendr-wrappers.R", path = "gtars-r", use_symbols = TRUE)'
          Rscript -e 'roxygen2::roxygenise("gtars-r", load_code = roxygen2::load_source)'
          git diff --exit-code -- gtars-r/man gtars-r/NAMESPACE gtars-r/R/extendr-wrappers.R
          test -z "$(git status --porcelain -- gtars-r/man)"

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build and install Python bindings
        working-directory: ./gtars-python
        run: |
          uv venv
          uv pip install maturin pytest pytest-cov
          uv run maturin develop --release

      - name: Run Python tests
        working-directory: ./gtars-python
        run: uv run pytest tests/ -v
